// Halo Shield: invert HL1's walk/run defaults.
// Default movement is a walk; holding +speed (Shift by default) sprints back to
// full HL1 movement speed. Values are HL1's vanilla walk magnitudes (cl_*speed *
// 0.52) with cl_movespeedkey set to ~1/0.52 so the sprint multiplier returns
// you to the original cl_forwardspeed of 400.

cl_forwardspeed  208
cl_backspeed     208
cl_sidespeed     208
cl_movespeedkey  2.0
