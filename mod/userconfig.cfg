// Halo Shield: invert HL1's walk/run defaults.
// Default movement is a walk; holding +speed (Shift by default) sprints back
// to full HL1 movement speed. Values are HL1's vanilla walk magnitudes
// (cl_*speed * 0.52) with cl_movespeedkey set to ~1/0.52 so the sprint
// multiplier returns you to the original cl_forwardspeed of 400.
//
// Lives in userconfig.cfg (not autoexec.cfg) because GoldSrc's load order is:
//   valve.rc -> autoexec.cfg -> [engine loads config.cfg] -> exec userconfig.cfg
// userconfig.cfg runs last, so its values survive whatever config.cfg saved.

cl_forwardspeed  208
cl_backspeed     208
cl_sidespeed     187
cl_movespeedkey  2.0
