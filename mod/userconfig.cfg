// Halo Shield: invert HL1's walk/run defaults.
// Default movement is a walk; holding +speed (Shift by default) sprints back
// to full HL1 movement speed. Values are HL1's vanilla walk magnitudes
// (cl_*speed * 0.52) with cl_movespeedkey set to ~1/0.52 so the sprint
// multiplier returns you to the original cl_forwardspeed of 400.
//
// Lives in userconfig.cfg (not autoexec.cfg) because GoldSrc's load order is:
//   valve.rc -> autoexec.cfg -> [engine loads config.cfg] -> exec userconfig.cfg
// userconfig.cfg runs last, so its values survive whatever config.cfg saved.

cl_forwardspeed  208
cl_backspeed     208
cl_sidespeed     187
cl_movespeedkey  2.0

// Instant weapon switching: pressing a number key swaps to that weapon now
// (no left-click confirm); pressing the same number again cycles to the next
// weapon in that slot. Scroll wheel cycles through all weapons immediately.
// Patched code in cl_dll/ammo.cpp keys off this cvar.
hud_fastswitch   1

// Aim-down-sights: right mouse focuses in on guns (no-op for crowbar/grenades).
// MOUSE2 used to be +attack2 (satchel detonator, crossbow scope, gauss charge),
// so we move that to MOUSE3 (wheel-click) to keep both accessible.
bind MOUSE2 "+ads"
bind MOUSE3 "+attack2"
